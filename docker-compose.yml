version: "3.7"
services:
  db:
    image: postgres:14.5
    container_name: db
    restart: always
    # ports:
    #   - "5432:5432"
    environment:
      - POSTGRES_PORT=${DB_PORT}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - internal

  cache:
    image: redis:6.2-alpine
    container_name: cache
    command: redis-server --save 20 1 --loglevel warning --requirepass eYVX7EwVmmxKPCDmwMtyKVge8oLd2t81
    networks:
      - internal
    volumes:
      - cache:/data

  app:
    container_name: app
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      # REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - ".:/app"
    ports:
      - "8080:8080"
    depends_on:
      - db
      - cache
      # - client
    networks:
      - internal
    stdin_open: true

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: worker
    volumes:
      - ".:/app"
    depends_on:
      - db
      - app
    networks:
      - internal

volumes:
  db-data:
    driver: local
  cache:
    driver: local
networks:
  internal:
    driver: bridge
